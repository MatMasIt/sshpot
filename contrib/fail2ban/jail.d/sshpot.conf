# /etc/fail2ban/jail.d/sshpot.conf
#
# Ban policy: any login attempt against the honeypot triggers an immediate ban.
# maxretry=1 is correct  no legitimate user should ever reach this port.

[sshpot]
enabled  = true
filter   = sshpot
logpath  = /var/log/sshpot/logins.csv

# One strike and you're banned.
maxretry = 1
findtime = 600

# 30 days. Set to -1 for permanent.
bantime  = 2592000

# Block all ports, not just SSH, and report to AbuseIPDB.
action   = iptables-allports[name=sshpot, protocol=all]
           abuseipdb

# Always whitelist your own management IPs.
ignoreip = 127.0.0.1/8 ::1
# ignoreip = 127.0.0.1/8 ::1 YOUR.MANAGEMENT.IP/32


#  Optional: recidive jail 
# Permanently ban IPs that get caught multiple times.
# Uncomment and add to /etc/fail2ban/jail.local instead if you prefer.
#
# [recidive]
# enabled   = true
# logpath   = /var/log/fail2ban.log
# banaction = iptables-allports
#             abuseipdb
# bantime   = -1
# findtime  = 86400
# maxretry  = 2
