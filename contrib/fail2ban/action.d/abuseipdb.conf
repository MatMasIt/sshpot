# /etc/fail2ban/action.d/abuseipdb.conf

[Definition]
actionban = curl --silent --fail --show-error \
    -H "Key: <abuseipdb_apikey>" \
    -H "Accept: application/json" \
    --data-urlencode "ip=<ip>" \
    --data "categories=18,22" \
    --data-urlencode "comment=SSH honeypot: login attempt recorded (credential stuffing). Automated report via fail2ban." \
    https://api.abuseipdb.com/api/v2/report
actionunban =
