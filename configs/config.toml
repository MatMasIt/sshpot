# sshpot configuration
# Copy to /etc/sshpot/config.toml and edit as needed.

[server]

# Address and port to listen on.
# Port 22 requires CAP_NET_BIND_SERVICE (granted by the systemd unit).
listen = "0.0.0.0:22"

# Maximum number of connections handled concurrently.
# Connections arriving when the limit is reached are dropped immediately.
max_connections = 100

# SSH version string presented to clients.
# Kept inline in config.
banner = "SSH-2.0-OpenSSH_5.1p1 Ubuntu-6ubuntu2"

# Text sent to the client after a successful login.
# Read from a separate file before privilege drop.
output_text_path = "/etc/sshpot/output_text.txt"

# Maximum time to complete the SSH handshake per connection.
handshake_timeout = "10s"

# Time to wait for a shell request after accepting a session channel.
shell_request_timeout = "2s"

# Pause before writing output to the client (simulates terminal render lag).
pre_output_delay = "500ms"

# Time to wait after writing output before closing the session.
post_output_delay = "2s"

[logging]

# Path to the append-only CSV log file.
# Columns: timestamp, ip, username, password, remote_ssh_version
path = "/var/log/sshpot/logins.csv"

# Controls how the password is stored in the log.
# See docs/password-secrets.md for a full description of each mode.
# Encrypted modes also require [logging].secrets_pubkey to point at a PEM
# encoded X25519 public key.
#
#   "plain"                        store the password as-is
#   "hash"                         store base64(sha256(password))
#   "none"                         omit the password field entirely
#   "enc_x25519_aes256gcm"         hybrid encryption, AES-256-GCM
#   "enc_x25519_chacha20poly1305"  hybrid encryption, ChaCha20-Poly1305
secrets_mode = "plain"

[ratelimit]

# Number of hash buckets in the lossy bloom filter.
# Each bucket tracks one cooldown window. Collisions are acceptable —
# they cause occasional false positives (over-limiting), never false
# negatives (under-limiting). 16 is intentionally small; increase if
# you observe significant legitimate traffic being dropped.
bucket_count = 16

# Minimum time between connections mapped to the same bucket.
rest_interval = "10s"

[process]

# User and group to drop privileges to after binding the port.
# The install target creates this dedicated system account automatically.
user  = "sshpot"
group = "sshpot"