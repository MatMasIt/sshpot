# sshpot configuration
# Copy to /etc/sshpot/config.toml and edit as needed.

[server]
# Address and port to listen on.
# Port 22 requires CAP_NET_BIND_SERVICE (granted by the systemd unit).
listen = "0.0.0.0:22"

# SSH banner presented to clients.
# Mimics Ubuntu 9.10 (Karmic Koala) / OpenSSH 5.1p1.
banner = "SSH-2.0-OpenSSH_5.1p1 Ubuntu-6ubuntu2"

# Text shown after a successful login.
# Use a TOML multiline string for multi-line output.
# Template helpers:
#   {{ nowUTC }}              current UTC timestamp
#   {{ randInt 1 100 }}       random integer in a range
#   {{ randFloat 0 100 }}     random float in a range
#   {{ printf "%.1f%%" (randPercent) }}  random percent value
#   {{ if chance 25 }}...{{ end }}        conditional block with a 25%% chance
output_text = """Welcome to Ubuntu 9.10 (GNU/Linux 2.6.31-14-server x86_64)

 * Documentation:  https://help.ubuntu.com/

  System information as of {{ nowUTC }}

  System load:  {{ printf "%.2f" (randFloat 0.00 1.20) }} {{ printf "%.2f" (randFloat 0.00 0.90) }} {{ printf "%.2f" (randFloat 0.00 0.60) }}     Processes:           {{ randInt 72 110 }}
  Usage of /:   {{ printf "%.1f%%" (randFloat 18 84) }} of {{ diskSize 8.00 160.00 }}  Users logged in:     {{ randInt 0 3 }}
  Memory usage: {{ printf "%.0f%%" (randFloat 10 42) }}                IP address for eth0: {{ randIP "10.0.0.x" }}

Last login: {{ randDate "2009-10-29" "2018-11-01" }} from {{ randIP "192.168.1.x" }}
{{ if chance 25 }}
You have new mail.
{{ end }} 
This account is currently not available.
"""

# Maximum time to complete the SSH handshake per connection.
handshake_timeout = "10s"

# How long to wait for a shell request after accepting a session channel.
# Must be a duration string with unit, e.g. "2s".
shell_request_timeout = "2s"

# Small pause before writing output to the client (e.g. terminal render delay).
# Duration string with unit, e.g. "500ms".
pre_output_delay = "500ms"

# Time to wait after writing output before closing the session.
# Duration string with unit, e.g. "2s".
post_output_delay = "2s"

[logging]
# Path to the CSV log file.
path = "/var/log/sshpot/logins.csv"


[ratelimit]
# Number of buckets for the lossy counter bloom filter.
bucket_count = 16
# Time to wait before allowing another connection from the same bucket.
rest_interval = "10s"

[process]
# Drop to this uid/gid after binding the port.
# The install target creates the dedicated sshpot system account.
user = "sshpot"
group = "sshpot"
